asyncapi: 3.0.0
info:
  title: RedVital — Eventos del Servicio de Campañas
  version: 1.0.0
  description: |
    Contratos de los eventos que publica Campañas y de los que consume (DD
    V3.0, Tabla 27; Herramientas V4.0, entrada 93). Toda comunicación de
    Campañas con los demás servicios pasa por estos temas: ninguno llama a
    otro por HTTP.

    Política de contenido (RT-16): solo identificadores y datos públicos de la
    campaña, y la estructura común de auditoría. Nunca datos de donantes ni
    reservas.
defaultContentType: application/json

servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    security:
      - $ref: '#/components/securitySchemes/scram'

channels:
  campaniaPublicada:
    address: redvital.campanias.campaign-published.v1
    title: EV-03 — Campaña publicada
    description: |
      Se escribe en la bandeja de salida en la misma transacción que fija
      publicada_en. Consumidor: Donación (grupo donacion), que la proyecta
      localmente y genera los avisos a los donantes del territorio.
    messages:
      campaniaPublicada:
        $ref: '#/components/messages/CampaniaPublicada'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  auditoriaRegistrada:
    address: redvital.campanias.audit-recorded.v1
    title: EV-10 — Registro de auditoría (Campañas)
    description: |
      Cada registro de la serie de auditoría de Campañas sale en la misma
      transacción que lo escribe. Consumidor: Institucional (grupo
      institucional), que compone la bitácora del auditor (ST2, ADR-016).
    messages:
      auditoriaRegistrada:
        $ref: '#/components/messages/AuditoriaRegistrada'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  institucionCambiada:
    address: redvital.institucional.institution-changed.v1
    title: EV-07 — Institución cambiada (consumido)
    description: |
      Productor Institucional. Campañas lo consume (grupo campanias) para su
      copia de las instituciones: de ahí toma el municipio y la ruta de una
      campaña nueva y el nombre del banco que muestran los listados.
    messages:
      institucionCambiada:
        $ref: '#/components/messages/InstitucionCambiada'
  donacionCompletada:
    address: redvital.donacion.donation-completed.v1
    title: EV-01 — Donación registrada (consumido)
    description: Productor Donación. Campañas lo consume (grupo campanias) para contar donaciones por campaña (RF-25, D-09).
    messages:
      donacionCompletada:
        $ref: '#/components/messages/DonacionCompletada'

operations:
  publicarCampaniaPublicada:
    action: send
    channel:
      $ref: '#/channels/campaniaPublicada'
    messages:
      - $ref: '#/channels/campaniaPublicada/messages/campaniaPublicada'
  publicarAuditoriaRegistrada:
    action: send
    channel:
      $ref: '#/channels/auditoriaRegistrada'
    messages:
      - $ref: '#/channels/auditoriaRegistrada/messages/auditoriaRegistrada'
  consumirInstitucionCambiada:
    action: receive
    channel:
      $ref: '#/channels/institucionCambiada'
    messages:
      - $ref: '#/channels/institucionCambiada/messages/institucionCambiada'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [campanias]
        bindingVersion: 0.5.0
  consumirDonacionCompletada:
    action: receive
    channel:
      $ref: '#/channels/donacionCompletada'
    messages:
      - $ref: '#/channels/donacionCompletada/messages/donacionCompletada'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [campanias]
        bindingVersion: 0.5.0

components:
  securitySchemes:
    scram:
      type: scramSha512

  messages:
    CampaniaPublicada:
      name: campaign.published
      title: Campaña publicada
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/CampaniaPublicadaV1'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: campania_id
          bindingVersion: 0.5.0
    AuditoriaRegistrada:
      name: audit.recorded
      title: Registro de auditoría
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/AuditoriaRegistradaV1'
      bindings:
        kafka:
          key:
            type: string
            description: correlacion_id, para que los registros de una operación lleguen en orden
          bindingVersion: 0.5.0
    InstitucionCambiada:
      name: institution.changed
      title: Institución cambiada
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/InstitucionCambiadaV1'
    DonacionCompletada:
      name: donation.completed
      title: Donación registrada
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/DonacionCompletadaV1'

  schemas:
    Cabeceras:
      type: object
      required: [evento-id, evento-tipo, evento-version, correlacion-id, ocurrido-en, productor]
      properties:
        evento-id:
          type: string
          format: uuid
        evento-tipo:
          type: string
        evento-version:
          type: string
        correlacion-id:
          type: string
          maxLength: 36
        ocurrido-en:
          type: string
          format: date-time
        productor:
          type: string

    CampaniaPublicadaV1:
      type: object
      additionalProperties: false
      required: [campania_id, institucion_id, nombre, sede, territorio_codigo, territorio_ruta, inicia_en, termina_en, publicada_en]
      properties:
        campania_id:
          type: string
          format: uuid
        institucion_id:
          type: string
          format: uuid
          description: Institución organizadora.
        nombre:
          type: string
          maxLength: 160
        sede:
          type: string
          maxLength: 200
        territorio_codigo:
          type: string
          pattern: '^[0-9]{5}$'
          description: Código DIVIPOLA del municipio de la sede.
        territorio_ruta:
          type: string
          pattern: '^/00/[0-9]{2}/[0-9]{5}$'
        inicia_en:
          type: string
          format: date-time
        termina_en:
          type: string
          format: date-time
        publicada_en:
          type: string
          format: date-time

    DonacionCompletadaV1:
      type: object
      description: Forma definida por Donación. Campañas solo usa donacion_id y campania_id, y tolera campos nuevos.
      required: [donacion_id, campania_id]
      properties:
        donacion_id:
          type: string
          format: uuid
        campania_id:
          type: [string, 'null']
          format: uuid

    AuditoriaRegistradaV1:
      type: object
      description: Estructura común de las cuatro series (DD, Sección 5). Sin el contenido del recurso.
      additionalProperties: false
      required: [id, actor_tipo, actor_id, rol, jurisdiccion_solicitada, operacion, recurso_tipo, recurso_id, resultado,
                 correlacion_id, origen, ocurrido_en]
      properties:
        id: { type: string, format: uuid }
        actor_tipo: { type: string, enum: [usuario, sistema, anonimo] }
        actor_id: { type: [string, 'null'], maxLength: 64 }
        rol: { type: [string, 'null'], maxLength: 40 }
        jurisdiccion_solicitada: { type: [string, 'null'], maxLength: 80 }
        operacion: { type: string, maxLength: 80 }
        recurso_tipo: { type: string, maxLength: 40 }
        recurso_id: { type: [string, 'null'], format: uuid }
        resultado: { type: string, enum: [permitido, denegado] }
        correlacion_id: { type: string, maxLength: 36 }
        origen: { type: [string, 'null'], maxLength: 45 }
        ocurrido_en: { type: string, format: date-time }

    InstitucionCambiadaV1:
      type: object
      description: Forma definida por Institucional. Campañas tolera campos nuevos.
      required: [institucion_id, codigo, nombre, tipo, territorio_codigo, territorio_ruta, vigente, cambiado_en]
      properties:
        institucion_id: { type: string, format: uuid }
        codigo: { type: string, maxLength: 20, description: Código de habilitación. }
        nombre: { type: string, maxLength: 160 }
        tipo: { type: string, enum: [banco_de_sangre, servicio_transfusion] }
        territorio_codigo: { type: string, pattern: '^[0-9]{5}$', description: Código DIVIPOLA del municipio. }
        territorio_ruta: { type: string, pattern: '^/00/[0-9]{2}/[0-9]{5}$' }
        vigente: { type: boolean, description: Falso si se dio de baja; la institución se sigue publicando. }
        cambiado_en:
          type: string
          format: date-time
          description: Momento del cambio; un consumidor no reemplaza su copia con un evento más viejo.
